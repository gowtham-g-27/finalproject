services:
  - type: web
    name: evereg-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_FIREBASE
        value: "true"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
